name: Build and Publish Resono Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: leo21mclt/resono

jobs:
  build-and-push:
    name: Build and Publish to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Resono Jellyfin Plugin
        run: |
          dotnet build resono-jellyfin-plugin/Resono.Plugin.csproj -c Release -o resono-jellyfin-plugin/dist -v normal
          mkdir -p resono-gateway/plugin
          cp resono-jellyfin-plugin/dist/Resono.Plugin.dll resono-gateway/plugin/Resono.Plugin.dll

      - name: Commit updated DLL back to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add resono-gateway/plugin/Resono.Plugin.dll
          git diff --staged --quiet || (git commit -m "build: update compiled Resono.Plugin.dll [skip ci]" && git push origin main) || true

      - name: Upload Resono Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resono.Plugin-dll
          path: resono-jellyfin-plugin/dist/Resono.Plugin.dll

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./resono-gateway
          file: ./resono-gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
