services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    ports:
      - "8096:8096"
    volumes:
      - ${JELLYFIN_CONFIG_DIR:-./config/jellyfin}:/config
      - ${JELLYFIN_CACHE_DIR:-./cache/jellyfin}:/cache
      - ${JELLYFIN_MEDIA_DIR:-./media/music}:/media/music
    restart: unless-stopped

#  slskd:
#    image: slskd/slskd:latest
#    container_name: slskd
#    restart: unless-stopped
#    environment:
#      - SLSKD_NO_AUTH=true
#      - SLSKD_SLSK_USERNAME=${SLSKD_SLSK_USERNAME:-}
#      - SLSKD_SLSK_PASSWORD=${SLSKD_SLSK_PASSWORD:-}
#    volumes:
#      - slskd-config:/app
#      - slskd-downloads:/app/downloads
#    ports:
#      - "5030:5030"
#      - "2234:2234"

  resono-gateway:
    build:
      context: ./resono-gateway
      dockerfile: Dockerfile
    image: ghcr.io/leo21mclt/resono:latest
    container_name: resono-gateway
    restart: unless-stopped
    environment:
      - RESONO_HOST=0.0.0.0
      - RESONO_PORT=8080
      - RESONO_MAX_CACHE_SIZE_GB=${RESONO_MAX_CACHE_SIZE_GB:-50.0}
      - RESONO_MIN_FREE_DISK_GB=${RESONO_MIN_FREE_DISK_GB:-10.0}
      - RESONO_MATCHER_CONFIDENCE_THRESHOLD=${RESONO_MATCHER_CONFIDENCE_THRESHOLD:-0.80}
      - RESONO_DEEZER_ARL=${RESONO_DEEZER_ARL:-}
      - RESONO_PRIMARY_PLAYBACK_SOURCE=${RESONO_PRIMARY_PLAYBACK_SOURCE:-deezer}
      - RESONO_FALLBACK_PLAYBACK_SOURCE=${RESONO_FALLBACK_PLAYBACK_SOURCE:-none}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
    volumes:
      - resono-data:/app/data
      - resono-cache:/app/cache
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  resono-data:
  resono-cache:
