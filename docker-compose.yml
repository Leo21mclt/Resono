services:
  resono-plugin-init:
    image: alpine:latest
    container_name: resono-plugin-init
    environment:
      - RESONO_AUTO_UPDATE_PLUGIN=${RESONO_AUTO_UPDATE_PLUGIN:-true}
    volumes:
      - ${JELLYFIN_CONFIG_DIR:-./config/jellyfin}/plugins/Resono:/target
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /target
        echo "[Resono] Checking for Resono.Plugin.dll..."
        if [ ! -f /target/Resono.Plugin.dll ] || [ "$$RESONO_AUTO_UPDATE_PLUGIN" = "true" ]; then
          echo "[Resono] Downloading latest Resono.Plugin.dll..."
          wget -qO /target/Resono.Plugin.dll https://raw.githubusercontent.com/Leo21mclt/Resono/main/resono-gateway/plugin/Resono.Plugin.dll
          chmod 755 /target/Resono.Plugin.dll
          echo "[Resono] Plugin installed successfully to /config/plugins/Resono/Resono.Plugin.dll"
        else
          echo "[Resono] Plugin already present at /config/plugins/Resono/Resono.Plugin.dll"
        fi
    restart: "no"

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    depends_on:
      resono-plugin-init:
        condition: service_completed_successfully
      resono-gateway:
        condition: service_healthy
    ports:
      - "8096:8096"
    volumes:
      - ${JELLYFIN_CONFIG_DIR:-./config/jellyfin}:/config
      - ${JELLYFIN_CACHE_DIR:-./cache/jellyfin}:/cache
      - ${JELLYFIN_MEDIA_DIR:-./media/music}:/media/music

  resono-gateway:
    build:
      context: ./resono-gateway
      dockerfile: Dockerfile
    image: ghcr.io/leo21mclt/resono:latest
    container_name: resono-gateway
    restart: unless-stopped
    environment:
      - RESONO_HOST=0.0.0.0
      - RESONO_PORT=8080
      - RESONO_MAX_CACHE_SIZE_GB=${RESONO_MAX_CACHE_SIZE_GB:-25.0}
      - RESONO_MIN_FREE_DISK_GB=${RESONO_MIN_FREE_DISK_GB:-10.0}
      - RESONO_MATCHER_CONFIDENCE_THRESHOLD=${RESONO_MATCHER_CONFIDENCE_THRESHOLD:-0.80}
      - RESONO_DEEZER_ARL=${RESONO_DEEZER_ARL:-}
      - RESONO_PRIMARY_PLAYBACK_SOURCE=${RESONO_PRIMARY_PLAYBACK_SOURCE:-deezer}
      - RESONO_FALLBACK_PLAYBACK_SOURCE=${RESONO_FALLBACK_PLAYBACK_SOURCE:-none}
      - RESONO_DEEZER_PIPE_URL=${RESONO_DEEZER_PIPE_URL:-https://search.leo21-mclt.workers.dev/api}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
    volumes:
      - resono-data:/app/data
      - resono-cache:/app/cache
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  resono-data:
  resono-cache:

